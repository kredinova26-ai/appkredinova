<style>
:root{
  --bg:#F0F4EE;--surface:#FFFFFF;--surface-2:#F5F8F6;--ink:#12261F;--muted:#5B6B64;--line:#D6DFD9;
  --brand:#17692C;--brand-ink:#FFFFFF;--brand-soft:#E1F0DA;--leaf:#4E9A2A;
  --late:#B42318;--late-soft:#FDE8E6;--due:#9A5A06;--due-soft:#FCEFD9;--info:#2F5D8A;--info-soft:#E3ECF6;
  --display:"Montserrat",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:64px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1613;--surface:#14201B;--surface-2:#1A2923;--ink:#E4EDE8;--muted:#94A79E;--line:#29392F;
  --brand:#6CC650;--brand-ink:#0B2610;--brand-soft:#1B3A1C;--leaf:#8FD86A;
  --late:#F27C70;--late-soft:#3A1916;--due:#E8AA4C;--due-soft:#38290F;--info:#8CB8E6;--info-soft:#1A2A3B;}}
:root[data-theme="dark"]{
  --bg:#0D1613;--surface:#14201B;--surface-2:#1A2923;--ink:#E4EDE8;--muted:#94A79E;--line:#29392F;
  --brand:#6CC650;--brand-ink:#0B2610;--brand-soft:#1B3A1C;--leaf:#8FD86A;
  --late:#F27C70;--late-soft:#3A1916;--due:#E8AA4C;--due-soft:#38290F;--info:#8CB8E6;--info-soft:#1A2A3B;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;min-height:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.15rem}h3{font-size:1rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
/* nav */
.side{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:none;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs::-webkit-scrollbar{display:none}

.btn-campana svg{width:19px;height:19px}.btn-campana .badge{position:absolute;top:-4px;right:-4px;background:var(--late)}
.punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--late);margin-right:6px;vertical-align:1px}
.falt{margin:0;padding-left:18px;font-size:.84rem;color:var(--due)}.falt li{margin:2px 0}
hr.sep{border:0;border-top:1px dashed var(--line);margin:4px 0}
table.cmp td,table.cmp th{white-space:normal}
/* documentos carta */
.doc{font-family:Arial,Helvetica,sans-serif;font-size:9.5pt;color:#000;line-height:1.3}
.doc .d-head{display:flex;align-items:center;gap:10px;border-bottom:2px solid #17692C;padding-bottom:6px;margin-bottom:8px}
.doc .d-head img{width:46px}.doc .d-emp{font-weight:700;font-size:11pt}.doc .d-sub{font-size:8.5pt}
.doc .d-tit{margin-left:auto;text-align:right;font-weight:700;font-size:12pt}.doc .d-tit small{display:block;font-weight:400;font-size:8.5pt}
.doc.d-compacto{font-size:8.6pt}.doc.d-compacto table.d-t{margin-bottom:3px;table-layout:fixed}
.doc.d-compacto table.d-t td,.doc.d-compacto table.d-t th{padding:2px 4px;font-size:8.3pt;line-height:1.25}
.doc.d-compacto table.d-t td small{font-size:6.6pt}.doc.d-compacto .d-head{margin-bottom:5px;padding-bottom:4px}
.doc.d-compacto table.d-t th.c,.doc.d-compacto table.d-t td.c{text-align:center}
.doc.d-compacto .d-firmas{margin:30px 0 0;gap:18px}
.doc .d-aviso{border:1px solid #9A5A06;background:#FCEFD9;color:#5a3a04;font-size:8.5pt;font-weight:600;padding:5px 8px;margin:0 0 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .d-pag2{break-before:page;page-break-before:always}
.doc .d-sec{break-after:avoid;page-break-after:avoid}
.doc .d-sec{background:#E1F0DA;font-weight:700;padding:3px 6px;margin:8px 0 0;border:1px solid #999;border-bottom:0;text-transform:uppercase;font-size:8.8pt}
.doc table.d-t{width:100%;border-collapse:collapse;margin:0 0 4px;page-break-inside:avoid}
.doc table.d-t td,.doc table.d-t th{border:1px solid #999;padding:3px 5px;vertical-align:top;white-space:normal;font-size:9pt;color:#000;background:none}
.doc table.d-t th{background:#f1f4f1;text-align:left}
.doc table.d-t td small{display:block;font-size:7pt;color:#444;text-transform:uppercase}
.doc table.d-t td.num{text-align:right}.doc table.d-t td.c{text-align:center;font-weight:700}
.doc .d-plan td,.doc .d-plan th{padding:2px 5px;font-size:8.5pt}
/* Las tablas largas (plan de pagos, hoja de ruta) continúan en la hoja siguiente en lugar de saltar completas */
.doc table.d-plan{page-break-inside:auto;break-inside:auto}
.doc table.d-plan thead{display:table-header-group}
.doc table.d-plan tr{page-break-inside:avoid;break-inside:avoid}
.doc .d-legal{font-size:7.8pt;text-align:justify;margin:8px 0}
.doc .d-firmas{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:34px 0 10px}.doc .d-firmas.d-4{grid-template-columns:repeat(4,1fr)}
.doc .d-firmas div{border-top:1px solid #000;text-align:center;padding-top:3px;font-size:8.5pt}
.doc .d-firmas:has(div:nth-child(2):last-child){grid-template-columns:repeat(2,1fr)}
.doc .d-firmas:has(div:only-child){grid-template-columns:1fr 1fr}
.doc.ec .ec-banner{background:#EEF7EA;display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;margin:-2px 0 10px;font-family:Montserrat,Arial,sans-serif;font-size:24pt;font-weight:600;color:#12261F;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc.ec .ec-banner img{width:54px}
.doc.ec .ec-tit{text-align:center;font-weight:700;font-size:14pt;margin:6px 0 14px}.doc.ec .ec-tit small{display:block;font-weight:400;font-size:8.5pt;margin-top:2px}
.doc.ec .ec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px;padding-bottom:10px;border-bottom:1px solid #ccc;margin-bottom:12px}
.doc.ec .ec-d small{display:block;font-weight:700;font-size:8.5pt}.doc.ec .ec-d b{color:#1a8fc9;font-size:9pt}
.doc.ec .ec-tablas{display:grid;grid-template-columns:1.05fr 1fr;gap:14px}.doc.ec h3{font-size:11pt;margin:0 0 6px}
.doc.ec table.ec-t{width:100%;border-collapse:collapse;font-size:7.8pt}.doc.ec .ec-t th{font-weight:700;border-bottom:1px solid #ccc;padding:3px 2px;text-align:center}
.doc.ec .ec-t td{padding:2.5px 2px;text-align:center;border-bottom:1px solid #eee;white-space:nowrap}.doc.ec .ec-t tfoot td{font-weight:700;border-top:2px solid #333;border-bottom:0}
.doc.ec .ec-t tr{page-break-inside:avoid}
.doc-prev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;overflow:auto}
</style>
</head>

/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round((Number(x)+Number.EPSILON)*100)/100;
const num=x=>{const n=parseFloat(String(x).replace(/,/g,''));return isFinite(n)?n:0};
const fmt=x=>'C$\u00a0'+(Number(x)||0).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=x=>'C$\u00a0'+Math.round(Number(x)||0).toLocaleString('es-NI');
const uid=()=>Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b=>b.toString(16).padStart(2,'0')).join('');
const toD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const toS=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return toS(d)};
const diffDays=(a,b)=>Math.round((toD(a)-toD(b))/864e5);
const lastDay=(y,m)=>new Date(Date.UTC(y,m+1,0)).getUTCDate();
const hoyS=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

/* === Clasificación de los pagos (idéntica en la app y el servidor) ===
   Referencia = lo exigible a la fecha (cuotas vencidas + cuota del día + mora) o, si no hay nada vencido, la próxima cuota.
   · Menos que la referencia ............................ ABONO A CUOTA
   · La referencia (hasta C$ 1 más por redondeo) ........ PAGO DE CUOTA
   · Más que eso, sin liquidar todo ..................... PAGO ANTICIPADO
   · Liquida toda la deuda .............................. CANCELACION DE CREDITO */
function clasificarPago(p, monto, fecha, condonar, tolerancia) {
  const tol = tolerancia == null || tolerancia === '' || isNaN(Number(tolerancia)) ? 1 : Number(tolerancia);
  let exig = 0, mora = 0, total = 0, prox = 0;
  p.cuotas.forEach(c => {
    const e = estCuota(p, c, fecha); if (e.estado === 'pagada') return;
    total += e.saldo; mora += e.moraPend;
    if (c.fecha <= fecha) exig += e.saldo; else if (!prox) prox = e.saldo;
  });
  const moraCobrar = condonar ? 0 : mora;
  const cancelacion = r2(total + moraCobrar), referencia = r2(exig > 0 ? exig + moraCobrar : prox + moraCobrar);
  let concepto;
  if (monto >= cancelacion - 0.004) concepto = 'CANCELACION DE CREDITO';
  else if (monto < referencia - 0.004) concepto = 'ABONO A CUOTA';
  else if (monto <= referencia + tol + 0.004) concepto = 'PAGO DE CUOTA';
  else concepto = 'PAGO ANTICIPADO';
  return { concepto, referencia, cancelacion };
}
/* === Calendario de cobro: días de la semana en que se cobra y días feriados (idéntico en la app y el servidor) === */
const FERIADOS_NIC = '01-01 Año Nuevo\n05-01 Día Internacional del Trabajo\n07-19 Día de la Liberación\n09-14 Batalla de San Jacinto\n09-15 Día de la Independencia\n12-08 Purísima Concepción\n12-25 Navidad';
function pascua_(y) { // domingo de Pascua (algoritmo de Gauss / Meeus)
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);

  const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return y + '-' + String(mes).padStart(2, '0') + '-' + String(dia).padStart(2, '0');
}
/** Lee la lista de feriados: "MM-DD Nombre" (cada año) o "AAAA-MM-DD Nombre" (una sola vez). */
function leerFeriados(texto) {
  const fijos = {}, unicos = {}, errores = [];
  String(texto || '').split(/\r?\n/).forEach((ln, i) => {
    const t = ln.trim(); if (!t || t[0] === '#') return;
    let m = /^(\d{4})-(\d{2})-(\d{2})\s*(.*)$/.exec(t);
    if (m) { if (+m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31) unicos[m[1] + '-' + m[2] + '-' + m[3]] = m[4] || 'Feriado'; else errores.push(i + 1); return; }

    if (m && +m[1] >= 1 && +m[1] <= 12 && +m[2] >= 1 && +m[2] <= 31) fijos[m[1] + '-' + m[2]] = m[3] || 'Feriado'; else errores.push(i + 1);

function fechasCuotas(inicio, mod, n, cal) {

function generarCuotas({fecha,monto,interes,meses,modalidad,nCuotas}){
  const intTotal=r2(monto*interes*meses),total=r2(monto+intTotal);

const moraDiaria=p=>r2(p.monto*p.tasaMora*12/365);
function estCuota(p,c,hoy){

function aplicarPago(p,monto,fecha,condonar){

/* ============ cálculos de cartera ============ */
function activos(){return PV().filter(p=>resumen(p).estado!=='cancelado')}
// Una entrada por préstamo: lo exigible a una fecha (cuotas vencidas + la de ese día)
function agenda(){
  const hoy=hoyS(),out=[];
  for(const p of PV()){
    const r=resumen(p,hoy);if(r.estado==='cancelado')continue;
    const venc=p.cuotas.filter(c=>{const e=estCuota(p,c,hoy);return e.estado==='vencida'});
    if(venc.length){const e=exigibleAl(p,addDays(hoy,-1));const dias=estCuota(p,venc[0],hoy).dias;
      out.push({tipo:'atrasado',p,fecha:venc[0].fecha,cuotas:venc.map(c=>c.n),monto:r2(venc.reduce((s,c)=>s+estCuota(p,c,hoy).saldo,0)),mora:r.mora,dias})}
    for(const c of p.cuotas){const e=estCuota(p,c,hoy);if(e.estado==='pagada'||c.fecha<hoy)continue;
      if(diffDays(c.fecha,hoy)>31)break;
      out.push({tipo:c.fecha===hoy?'hoy':'proximo',p,fecha:c.fecha,cuotas:[c.n],monto:e.saldo,mora:0,dias:0})}
  }
  return out.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
}

function leerImagen(file,max){
  return new Promise((ok,fail)=>{
    if(!/^image\/(png|jpeg|webp)$/.test(file.type)){fail(new Error('Usa una imagen PNG, JPG o WEBP'));return}
    if(file.size>8*1024*1024){fail(new Error('La imagen pesa más de 8 MB'));return}
    const fr=new FileReader();fr.onerror=()=>fail(new Error('No se pudo leer el archivo'));
    fr.onload=()=>{const img=new Image();img.onerror=()=>fail(new Error('El archivo no es una imagen válida'));
      img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);let u=c.toDataURL('image/webp',0.88);if(!u.startsWith('data:image/webp'))u=c.toDataURL('image/png');ok(u)};
      img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

// Cédula nicaragüense: 000-000000-0000A · Teléfono o celular: 0000-0000
function formatoCedula(v) {
  const s = String(v == null ? '' : v).toUpperCase().replace(/[^0-9A-Z]/g, '');
  let d = '', letra = '';
  for (const ch of s) { if (d.length < 13 && /\d/.test(ch)) d += ch; else if (d.length === 13 && !letra && /[A-Z]/.test(ch)) letra = ch; }
  return d.slice(0, 3) + (d.length > 3 ? '-' + d.slice(3, 9) : '') + (d.length > 9 ? '-' + d.slice(9, 13) : '') + letra;
}
function formatoTelefono(v) {
  let d = String(v == null ? '' : v).replace(/\D/g, '');
  if (d.length > 8 && d.indexOf('505') === 0) d = d.slice(3);   // quita el código de país si lo escribieron

  return d.slice(0, 4) + (d.length > 4 ? '-' + d.slice(4) : '');

/** Motivo por el que una cédula no es válida, o '' si está bien. Los 6 números del medio son la fecha de nacimiento (día, mes, año). */
function motivoCedula(v) {
  const s = String(v || '');
  const m = /^(\d{3})-(\d{2})(\d{2})(\d{2})-(\d{4})([A-Z])$/.exec(s);
  if (!m) return 'debe tener 13 números y una letra al final (000-000000-0000A)';
  const dd = +m[2], mm = +m[3], yy = +m[4];
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return 'los 6 números del medio son la fecha de nacimiento (día, mes, año) y ' + m[2] + '/' + m[3] + '/' + m[4] + ' no es una fecha válida';
  const anio = yy + (yy > (new Date().getFullYear() % 100) ? 1900 : 2000);
  if (dd > new Date(Date.UTC(anio, mm, 0)).getUTCDate()) return 'la fecha de nacimiento ' + m[2] + '/' + m[3] + '/' + m[4] + ' no existe';
  return '';
}
function cedulaValida(v) { return !motivoCedula(v); }
function telefonoValido(v) { return /^\d{4}-\d{4}$/.test(String(v || '')); }
/** Revisa cédulas y teléfonos de un objeto según una lista [campo, tipo, etiqueta]. */
function erroresFormato(obj, campos, pref) {
  const f = [];
  campos.forEach(([k, tipo, l]) => {
    const v = obj && obj[k]; if (v === undefined || v === null || String(v).trim() === '') return;
    if (tipo === 'cedula' && !cedulaValida(v)) f.push(pref + l + ': ' + motivoCedula(v));
    if (tipo === 'tel' && !telefonoValido(v)) f.push(pref + l + ' debe tener 8 dígitos (0000-0000)');
  });
  return f;
}

function faltantesConyuge(cy, cedulaCliente) {

  [['cedula', 'N° cédula'], ['nombres', 'Nombres'], ['apellidos', 'Apellidos'], ['celular', 'N° celular']].forEach(([k, l]) => { if (!v(cy[k])) f.push('Cónyuge: ' + l); });

  const f = [], v = x => x !== undefined && x !== null && String(x).trim() !== '';
  const req = (obj, campos, pref) => campos.forEach(([k, l]) => { if (!v((obj || {})[k])) f.push(pref + l); });
  const casado = x => /casad|uni[oó]n|acompa/i.test(String(x || ''));
  const asal = d.tipoCredito === 'ASALARIADO';
  req(d, [['promotor', 'Nombre del promotor'], ['gestor', 'Gestor de crédito'], ['tipoCredito', 'Tipo de crédito'], ['sector', 'Sector económico'], ['destino', 'Destino del crédito'],
    ['montoSolicitado', 'Monto solicitado'], ['frecuencia', 'Frecuencia'], ['plazoMeses', 'Plazo'], ['lugarCobro', 'Lugar de cobro']], 'Crédito: ');
  if (v(d.montoSolicitado) && !(Number(d.montoSolicitado) > 0)) f.push('Crédito: Monto solicitado debe ser mayor que cero');
  req(d.cliente, [['nombres', 'Nombres'], ['apellidos', 'Apellidos'], ['cedula', 'Cédula'], ['edad', 'Edad'], ['estadoCivil', 'Estado civil'], ['telefono', 'Teléfono'], ['sexo', 'Sexo'],
    ['departamento', 'Departamento'], ['municipio', 'Municipio'], ['barrio', 'Barrio'], ['antiguedadDomicilio', 'Antigüedad del domicilio'], ['direccion', 'Dirección domiciliar'], ['profesion', 'Profesión u oficio'],
    ['personasCargo', 'Personas a cargo'], ['vivienda', 'Tipo de vivienda']], 'Cliente: ');
  if (d.cliente && v(d.cliente.edad) && (Number(d.cliente.edad) < 18 || Number(d.cliente.edad) > 99)) f.push('Cliente: Edad fuera de rango (18 a 99)');
  if (casado(d.cliente && d.cliente.estadoCivil)) faltantesConyuge(d.conyuge, d.cliente && d.cliente.cedula).forEach(x => f.push(x));
  if (asal) req(d.negocio, [['actividad', 'Nombre de la empresa'], ['antiguedad', 'Antigüedad de laborar'], ['puesto', 'Puesto de trabajo'], ['salario', 'Salario mensual'],
    ['direccion', 'Dirección de la empresa'], ['telefono', 'Teléfono de la empresa'], ['jefe', 'Jefe inmediato'], ['telJefe', 'Teléfono del jefe inmediato']], 'Empresa: ');
  else req(d.negocio, [['actividad', 'Actividad del negocio'], ['antiguedad', 'Antigüedad del negocio'], ['direccion', 'Dirección del negocio'], ['telefono', 'Teléfono del negocio']], 'Negocio: ');
  if (asal && v(d.negocio && d.negocio.salario) && !(Number(d.negocio.salario) > 0)) f.push('Empresa: Salario mensual debe ser mayor que cero');
  { const oc = opcionesCredito(d.tipoCredito);
    if (v(d.sector) && oc.sectores.indexOf(d.sector) < 0) f.push('Crédito: el sector económico no corresponde al tipo de crédito');
    if (v(d.destino) && oc.destinos.indexOf(d.destino) < 0) f.push('Crédito: el destino no corresponde al tipo de crédito'); }
  const refs = d.referencias || [];
  [0, 1].forEach(i => req(refs[i], [['nombre', 'Nombres y apellidos'], ['direccion', 'Dirección'], ['parentesco', 'Parentesco'], ['telefono', 'Teléfono']], 'Referencia ' + (i + 1) + ': '));
  const par = [0, 1].map(i => String((refs[i] || {}).parentesco || '').trim().toUpperCase());
  if (par[0] && par[1] && !(par.indexOf('FAMILIAR') >= 0 && par.indexOf('AMISTAD') >= 0)) f.push('Referencias: debe haber una familiar y una de amistad');
  if (!asal) {
    const ven = d.ventas || {};
    const tot = ['buenas', 'regulares', 'malas'].reduce((t, k) => t + (ven[k] || []).reduce((a, x) => a + (Number(x) || 0), 0), 0);
    if (!(tot > 0)) f.push('Análisis del negocio: Ventas de la semana');
  }
  if (!d.sinFiador) {
    req(d.fiador, [['nombres', 'Nombres'], ['apellidos', 'Apellidos'], ['cedula', 'Cédula'], ['edad', 'Edad'], ['estadoCivil', 'Estado civil'], ['telefono', 'Teléfono'], ['sexo', 'Sexo'],
      ['departamento', 'Departamento'], ['municipio', 'Municipio'], ['barrio', 'Barrio'], ['direccion', 'Dirección domiciliar'], ['profesion', 'Profesión u oficio'], ['vivienda', 'Tipo de vivienda'],
      ['parentesco', 'Parentesco con el deudor'], ['sector', 'Sector económico']], 'Fiador: ');
    if (d.fiador && d.cliente && v(d.fiador.cedula) && String(d.fiador.cedula).trim().toLowerCase() === String(d.cliente.cedula || '').trim().toLowerCase()) f.push('Fiador: no puede ser el mismo deudor');
  }
  if (d.cliente && !municipioValido(d.cliente.departamento, d.cliente.municipio)) f.push('Cliente: el municipio no pertenece al departamento elegido');
  if (!d.sinFiador && d.fiador && !municipioValido(d.fiador.departamento, d.fiador.municipio)) f.push('Fiador: el municipio no pertenece al departamento elegido');
  // Formatos de cédula y teléfono
  erroresFormato(d.cliente, [['cedula', 'cedula', 'Cédula'], ['telefono', 'tel', 'Teléfono']], 'Cliente: ').forEach(x => f.push(x));
  erroresFormato(d.negocio, [['telefono', 'tel', 'Teléfono de la empresa'], ['telJefe', 'tel', 'Teléfono del jefe']], 'Trabajo: ').forEach(x => f.push(x));
  (d.referencias || []).forEach((r, i) => erroresFormato(r, [['telefono', 'tel', 'Teléfono']], 'Referencia ' + (i + 1) + ': ').forEach(x => f.push(x)));
  if (!d.sinFiador) erroresFormato(d.fiador, [['cedula', 'cedula', 'Cédula'], ['telefono', 'tel', 'Teléfono'], ['telJefe', 'tel', 'Teléfono del jefe']], 'Fiador: ').forEach(x => f.push(x));
  if (!d.declaracion) f.push('Declaración y autorización de consulta al buró aceptada');
  return f;
}
function totalVentasSemana(d) {
  const ven = (d && d.ventas) || {};

function faltantesGarantias(g, montoAprobado, minPct) {
  const f = [], items = (g && g.items || []).filter(x => x && (x.detalle || x.valor));
  if (!items.length) f.push('Registra al menos un bien en garantía');
  items.forEach((x, i) => {
    if (!String(x.detalle || '').trim()) f.push('Bien ' + (i + 1) + ': detalle');
    if (!(Number(x.valor) > 0)) f.push('Bien ' + (i + 1) + ': valor estimado');
    if (!x.ubicacion) f.push('Bien ' + (i + 1) + ': ubicación (domicilio o negocio)');
  });
  const total = items.reduce((t, x) => t + (Number(x.valor) || 0), 0);
  const min = Math.round((Number(montoAprobado) || 0) * (Number(minPct) || 0)) / 100;
  if (items.length && total < min) f.push('El valor total de las garantías (C$ ' + total.toFixed(2) + ') no cubre el mínimo de C$ ' + min.toFixed(2) + ' (' + minPct + '% del monto aprobado)');
  if (!g || !g.declaracion) f.push('Declaración de propiedad de los bienes aceptada');
  return f;
}

const VERIF_PUNTOS = [
  ['cliente', 'Información del cliente', [['cedula', 'Cédula de identidad original'], ['dueno', 'Cliente es dueño del negocio'], ['direccion', 'La dirección registrada es correcta'], ['telefono', 'Número de teléfono del cliente verificado']]],

  ['asalariado', 'Información cliente asalariado / informal', [['laborando', 'Cliente se encuentra activo laborando'], ['antiguedadLab', 'Se valida la antigüedad laboral'], ['politicas', 'Monto aprobado cumple políticas'], ['soportes', 'Soportes de ingresos están vigentes']]],
  ['garantias', 'Información de garantías', [['existen', 'Garantías declaradas existen en el negocio y/o domicilio']]]

function incumplimientosVerificacion(vf, tipoCredito) {
  const ch = (vf && vf.checks) || {}, out = [];
  VERIF_PUNTOS.forEach(([sec, titulo, items]) => {
    if (sec === 'asalariado' && tipoCredito !== 'ASALARIADO') return;
    if (sec === 'negocio' && tipoCredito === 'ASALARIADO') return;
    items.forEach(([k, l]) => { const c = ch[sec + '.' + k]; if (c && c.v === 'NO') out.push(l); });
  });
  return out;
}
function faltantesVerificacion(vf, tipoCredito) {
  const f = [], vv = vf || {}, ch = vv.checks || {};
  VERIF_PUNTOS.forEach(([sec, titulo, items]) => {
    if (sec === 'asalariado' && tipoCredito !== 'ASALARIADO') return;
    if (sec === 'negocio' && tipoCredito === 'ASALARIADO') return;
    items.forEach(([k, l]) => { const c = ch[sec + '.' + k]; if (!c || (c.v !== 'SI' && c.v !== 'NO')) f.push(titulo + ': ' + l); });
  });
  if (!vv.estadoGarantias) f.push('Estado de las garantías');
  const cal = vv.refCalif || [];
  [0, 1, 2].forEach(i => { if (!cal[i]) f.push('Referencia vecinal ' + (i + 1) + ': mala, regular o buena'); });
  if (!vv.zonaRiesgo) f.push('Zona de riesgo');
  if (!String(vv.verificadoPor || '').trim()) f.push('Verificado por');
  return f;
}

function cuotaEstimada(d,base){
  const monto=Number(d.montoSolicitado)||0,meses=Number(d.plazoMeses)||0,m=MOD[d.frecuencia];if(!(monto>0&&meses>0&&m))return null;
  const n=Math.max(1,Math.round(meses*m.porMes));const cu=generarCuotas({fecha:base||hoyS(),monto,interes:Number(CONFIG.interesDefault||15)/100,meses,modalidad:d.frecuencia,nCuotas:n});
  return {n,cuota:cu[0].total,primer:cu[0].fecha,dia:toD(cu[0].fecha).toLocaleDateString('es-NI',{weekday:'long',timeZone:'UTC'})};
}

function stepper(sol,paso){
  const pasos=[['1','Solicitud'],['2','Aprobación y plan'],['3','Garantías'],['4','Desembolso']];const act=pasoActual(sol);
  return `<nav class="stepper" aria-label="Pasos">${pasos.map(([n,t])=>{const done=sol&&(sol.estado==='DESEMBOLSADA'||Number(n)<act);const cur=Number(n)===paso;const dis=!sol||(Number(n)>act&&sol.estado!=='DESEMBOLSADA'&&sol.estado!=='DENEGADA');
    return `<a href="${dis?'javascript:void 0':`#/solicitud/${sol.id}/${n}`}" class="st ${cur?'cur':''} ${done?'done':''} ${dis?'dis':''}" ${cur?'aria-current="step"':''}><i>${done?'✓':n}</i><span>${t}</span></a>`}).join('')}</nav>`;
}

async function guardarSol(){
  if(!SOLD.declaracion){toast('Marca la declaración y autorización para guardar');return}
  const id=SOLID&&!SOLID.startsWith('nueva')?SOLID:null;

function tablaPlan(cu){let saldo=r2(cu.reduce((t,c)=>t+c.total,0));
  return `<div class="tablewrap" style="max-height:420px;overflow:auto"><table><thead><tr><th># Cuota</th><th>Fecha pago</th><th class="num">Saldo inicial</th><th class="num">Monto cuota</th><th class="num">Saldo final</th></tr></thead><tbody>
  ${cu.map(c=>{const ini=saldo;saldo=r2(saldo-c.total);return `<tr><td>${c.n}</td><td>${fF(c.fecha)}</td><td class="num">${n2(ini)}</td><td class="num">${n2(c.total)}</td><td class="num">${n2(Math.max(0,saldo))}</td></tr>`}).join('')}</tbody></table></div>`}

function actualizarGarantias(){

  const sino=(key)=>{const c=v.checks?.[key]||{};return `<td class="sn"><button type="button" class="chip" data-vchk="${key}" data-v="SI" aria-pressed="${c.v==='SI'}" ${ro}>Sí</button><button type="button" class="chip" data-vchk="${key}" data-v="NO" aria-pressed="${c.v==='NO'}" ${ro}>No</button></td><td><input class="mini w" data-vobs="${key}" value="${esc(c.obs||'')}" ${ro} aria-label="Observación"></td>`};
  const tri=(k,ops)=>`<div class="chips">${ops.map(o=>`<button type="button" class="chip" data-vsel="${k}" data-v="${o}" aria-pressed="${v[k]===o}" ${ro}>${o[0]+o.slice(1).toLowerCase()}</button>`).join('')}</div>`;

  const ap=sol.aprobacion||{};const act=cerrada?[]:activosCliente(sol.clienteId,ap.fechaDesembolso);const mora=r2(act.reduce((t,x)=>t+x.deuda.mora,0));
  const fg=faltantesGarantias(sol.garantias,ap.monto,CONFIG.garantiaMinPct);
  return `<div class="grid-sol"><div class="stack">

// Autorizador de desembolsos: si el administrador designó uno en Ajustes, solo esa persona da el visto bueno
const autorizadorDesignado=()=>String(CONFIG.autorizadorDesembolsos||'').toLowerCase();
function puedeAutorizar(){const d=autorizadorDesignado();return d?ME.id===d:puede('desembolsos.autorizar')}

  const e=sol.estado,auto=puedeAutorizar(),propio=v.enviadoPor===ME.id&&!ME.esPropietario;

}
function actualizarVerif(){

  const inc=incumplimientosVerificacion(VFD,sol.datos.tipoCredito);
  const bl=bloqueoClienteCli(sol.clienteId,sol.aprobacion?.fechaDesembolso<=hoyS()?sol.aprobacion.fechaDesembolso:hoyS());

/* ============ reportes y resúmenes para la gerencia ============ */
const RPT={periodo:'mes',desde:'',hasta:''};
const PERIODOS=[['hoy','Hoy'],['semana','Esta semana'],['mes','Este mes'],['mesant','Mes anterior'],['30d','Últimos 30 días'],['anio','Este año'],['custom','Personalizado']];
function rangoPeriodo(){
  const h=hoyS(),d=toD(h),y=d.getUTCFullYear(),m=d.getUTCMonth();const S2=x=>toS(x);
  switch(RPT.periodo){
    case 'hoy':return [h,h];
    case 'semana':{const w=(d.getUTCDay()+6)%7;return [addDays(h,-w),h]}
    case 'mesant':return [S2(new Date(Date.UTC(y,m-1,1))),S2(new Date(Date.UTC(y,m,0)))];
    case '30d':return [addDays(h,-29),h];
    case 'anio':return [`${y}-01-01`,h];
    case 'custom':return [RPT.desde||h,RPT.hasta||h];
    default:return [`${h.slice(0,7)}-01`,h];
  }
}
// Reparte un pago en capital, interés y mora (lo aplicado a cada cuota según su proporción capital/interés)
function desglosePago(pg){
  const p=S.prestamos[pg.prestamoId];let cap=0,int=0;
  if(p&&(pg.aplic||[]).length){pg.aplic.forEach(a=>{const c=p.cuotas.find(q=>q.n===a.n);const k=c&&c.total?c.capital/c.total:1;cap+=a.cuota*k;int+=a.cuota*(1-k)})}
  else if(p){const base=Math.max(0,pg.monto-(pg.mora||0));const k=p.monto/(p.monto+p.monto*p.interes*p.meses);cap=base*k;int=base-cap}
  return {capital:r2(cap),interes:r2(int),mora:r2(pg.mora||0),condonado:r2(pg.condonado||0)};
}
function diasAtrasoPrestamo(p,hoy){let d=0;p.cuotas.forEach(c=>{const e=estCuota(p,c,hoy);if(e.estado==='vencida')d=Math.max(d,diffDays(hoy,c.fecha))});return d}
const TRAMOS=[['aldia','Al día',0,0],['1-7','1 a 7 días',1,7],['8-30','8 a 30 días',8,30],['31-60','31 a 60 días',31,60],['61-90','61 a 90 días',61,90],['90+','Más de 90 días',91,1e9]];
function calcularReportes(){
  const hoy=hoyS(),[desde,hasta]=rangoPeriodo(),en=f=>f&&f>=desde&&f<=hasta;
  const ps=PV(),pagos=Object.values(S.pagos).filter(x=>!x.anulado&&S.prestamos[x.prestamoId]);
  // Cartera a hoy
  const act=ps.map(p=>({p,r:resumen(p,hoy),d:diasAtrasoPrestamo(p,hoy)})).filter(x=>x.r.estado!=='cancelado');
  const cart={prestamos:act.length,clientes:new Set(act.map(x=>x.p.clienteId)).size,saldo:0,capital:0,mora:0,interesPorCobrar:0};
  act.forEach(x=>{cart.saldo+=x.r.saldo;cart.capital+=x.r.capPend;cart.mora+=x.r.mora});cart.interesPorCobrar=cart.saldo-cart.capital;
  const tramos=TRAMOS.map(([k,l,a,b])=>{const xs=act.filter(x=>x.d>=a&&x.d<=b);return {k,l,n:xs.length,capital:r2(xs.reduce((t,x)=>t+x.r.capPend,0)),saldo:r2(xs.reduce((t,x)=>t+x.r.saldo,0))}});
  const par=n=>cart.capital?r2(act.filter(x=>x.d>n).reduce((t,x)=>t+x.r.capPend,0)/cart.capital*100):0;
  // Colocación del periodo
  const col=ps.filter(p=>en(p.fecha));
  const colocacion={n:col.length,monto:r2(col.reduce((t,p)=>t+p.monto,0)),entregado:r2(col.reduce((t,p)=>t+(p.montoEntregado||p.monto),0)),
    nuevos:col.filter(p=>p.tipoOperacion!=='REPRESTAMO').length,represtamos:col.filter(p=>p.tipoOperacion==='REPRESTAMO').length,
    liquidado:r2(col.reduce((t,p)=>t+(p.saldoLiquidado||0),0)),interesProyectado:r2(col.reduce((t,p)=>t+p.monto*p.interes*p.meses,0)),
    porModalidad:MOD_ORDEN.map(m=>({m,n:col.filter(p=>p.modalidad===m).length,monto:r2(col.filter(p=>p.modalidad===m).reduce((t,p)=>t+p.monto,0))})).filter(x=>x.n)};
  colocacion.ticket=colocacion.n?r2(colocacion.monto/colocacion.n):0;
  // Recuperación del periodo
  const pp=pagos.filter(x=>en(x.fecha));const rec={n:pp.length,total:0,capital:0,interes:0,mora:0,condonado:0};
  pp.forEach(x=>{const dg=desglosePago(x);rec.total+=x.monto;rec.capital+=dg.capital;rec.interes+=dg.interes;rec.mora+=dg.mora;rec.condonado+=dg.condonado});
  Object.keys(rec).forEach(k=>rec[k]=r2(rec[k]));rec.ingresos=r2(rec.interes+rec.mora);
  // Cumplimiento: cuotas que vencían en el periodo (hasta hoy) y cuánto se pagó de ellas
  let exig=0,cumplido=0,cuotasV=0,cuotasOk=0;const lim=hasta<hoy?hasta:hoy;
  ps.forEach(p=>p.cuotas.forEach(c=>{if(c.fecha>=desde&&c.fecha<=lim){exig+=c.total;cumplido+=Math.min(c.pagado,c.total);cuotasV++;if(c.pagadaEl&&c.pagadaEl<=c.fecha)cuotasOk++}}));
  const cumplimiento={exigible:r2(exig),pagado:r2(cumplido),pct:exig?r2(cumplido/exig*100):0,cuotas:cuotasV,puntuales:cuotasOk,pctPuntual:cuotasV?r2(cuotasOk/cuotasV*100):0};
  // Proyección de cobros: próximas 4 semanas
  const proy=[0,1,2,3].map(i=>{const a=addDays(hoy,i*7+1),b=addDays(hoy,i*7+7);let m=0,n=0;act.forEach(x=>x.p.cuotas.forEach(c=>{if(c.fecha>=a&&c.fecha<=b){const e=estCuota(x.p,c,hoy);if(e.saldo>0){m+=e.saldo;n++}}}));return {a,b,monto:r2(m),n}});
  const vencidoHoy=r2(act.reduce((t,x)=>t+x.r.vencido+x.r.mora,0));
  // Por gestor / cobrador
  const gest={};const g=k=>gest[k]=gest[k]||{k,prestamos:0,saldo:0,capital:0,saldoMora:0,colocado:0,nColocado:0,cobrado:0,nPagos:0};
  act.forEach(x=>{const o=g(x.p.cobradorId||'');o.prestamos++;o.saldo+=x.r.saldo;o.capital+=x.r.capPend;if(x.d>0)o.saldoMora+=x.r.capPend});
  col.forEach(p=>{const o=g(p.cobradorId||'');o.colocado+=p.monto;o.nColocado++});
  pp.forEach(x=>{const o=g(x.creadoPor||'');o.cobrado+=x.monto;o.nPagos++});
  const gestores=Object.values(gest).map(o=>({...o,saldo:r2(o.saldo),capital:r2(o.capital),saldoMora:r2(o.saldoMora),colocado:r2(o.colocado),cobrado:r2(o.cobrado),pctMora:o.capital?r2(o.saldoMora/o.capital*100):0})).sort((a,b)=>b.saldo-a.saldo);
  // Solicitudes del periodo
  const sols=solVista().filter(x=>en(x.fecha));const cuenta=e=>sols.filter(x=>x.estado===e).length;
  const des=cuenta('DESEMBOLSADA'),den=cuenta('DENEGADA');
  const solicitudes={n:sols.length,tramite:sols.filter(x=>['BORRADOR','COMPLETA','APROBADA','POR_AUTORIZAR','AUTORIZADA'].includes(x.estado)).length,aprobadas:cuenta('APROBADA'),desembolsadas:des,denegadas:den,
    tasaAprob:des+den?r2(des/(des+den)*100):0,solicitado:r2(sols.reduce((t,x)=>t+(x.montoSolicitado||0),0)),aprobado:r2(sols.reduce((t,x)=>t+(x.montoAprobado||0),0)),
    motivos:sols.filter(x=>x.estado==='DENEGADA'&&x.motivoDenegacion).map(x=>({n:x.numero,cli:nombreSol(x),m:x.motivoDenegacion}))};
  // Morosos
  const morosos=act.filter(x=>x.d>0).sort((a,b)=>b.d-a.d||b.r.saldo-a.r.saldo).slice(0,15).map(x=>({p:x.p,c:cliente(x.p.clienteId),d:x.d,vencido:r2(x.r.vencido),mora:x.r.mora,saldo:x.r.saldo}));
  // Clientes
  const clis=CV();const deptos={};clis.forEach(c=>{const d=c.departamento||deptoDeMunicipio(c.municipio)||'Sin departamento';deptos[d]=(deptos[d]||0)+1});
  const clientes={total:clis.length,activos:cart.clientes,nuevos:clis.filter(c=>en(String(c.creado||'').slice(0,10))).length,
    recurrentes:clis.filter(c=>ps.filter(p=>p.clienteId===c.id).length>1).length,deptos:Object.entries(deptos).sort((a,b)=>b[1]-a[1]).slice(0,8)};
  // Tendencia de 6 meses
  const d0=toD(hoy);const meses=[5,4,3,2,1,0].map(i=>{const y=d0.getUTCFullYear(),m=d0.getUTCMonth()-i;const a=toS(new Date(Date.UTC(y,m,1))),b=toS(new Date(Date.UTC(y,m+1,0)));
    return {lbl:toD(a).toLocaleDateString('es-NI',{month:'short',timeZone:'UTC'}),colocado:r2(ps.filter(p=>p.fecha>=a&&p.fecha<=b).reduce((t,p)=>t+p.monto,0)),cobrado:r2(pagos.filter(x=>x.fecha>=a&&x.fecha<=b).reduce((t,x)=>t+x.monto,0))}});
  Object.keys(cart).forEach(k=>cart[k]=r2(cart[k]));
  return {hoy,desde,hasta,cart,tramos,par1:par(0),par8:par(7),par30:par(30),par90:par(90),colocacion,rec,cumplimiento,proy,vencidoHoy,gestores,solicitudes,morosos,clientes,meses};
}
const pct=v=>`${(Number(v)||0).toLocaleString('es-NI',{maximumFractionDigits:1})}%`;
function kpi(l,v,sub,tone){return `<div class="panel stat"><div class="v" ${tone?`style="color:var(--${tone})"`:''}>${v}</div><div class="l">${l}</div>${sub?`<div class="small muted">${sub}</div>`:''}</div>`}

/* ============ cobros sin conexión ============ */
// Si no hay internet, el cobro se guarda en este dispositivo con un comprobante PROVISIONAL.
// Al volver la conexión se envía al servidor, que asigna el número de recibo oficial.
// Cada cobro lleva un código único (ref): aunque se envíe dos veces, el servidor lo registra una sola vez.
const COLA_K='kn_cola',CACHE_K='kn_cache';
let SIN_RED=false,SINCRONIZANDO=false,ESTADO_CACHE_TS=null;
function leerCola(){try{return JSON.parse(localStorage.getItem(COLA_K)||'[]')}catch(e){return []}}
function guardarCola(c){try{localStorage.setItem(COLA_K,JSON.stringify(c))}catch(e){toast('No hay espacio para guardar el cobro sin conexión')}}
function esErrorRed(e){return !!(e&&e.sinRed)}
function guardarCache(r){try{if(r&&r.me&&r.me.rol&&r.prestamos)localStorage.setItem(CACHE_K,JSON.stringify({ts:new Date().toISOString(),usuario:r.me.email,r}))}catch(e){}}
function leerCache(){try{return JSON.parse(localStorage.getItem(CACHE_K)||'null')}catch(e){return null}}
// Vuelve a aplicar sobre los datos del servidor los cobros que aún no se han enviado
function aplicarColaLocal(){
  leerCola().filter(q=>q.usuario===ME.id).forEach(q=>{
    const p=S.prestamos[q.pid];if(!p||S.pagos[q.ref])return;
    const cuotasAntesCola=p.cuotas.map(c=>({...c}));const antes=desgloseCli(p,q.fecha);antes.totalPagar=r2(antes.cuotaDia+antes.atrasado+antes.mora);const a=aplicarPago(p,q.monto,q.fecha,q.cond);
    if(a.sobrante>0.004&&!q.error)q.error='El monto ya excede la deuda del préstamo';
    p.cuotas=a.cuotas;const desp=desgloseCli(p,q.fecha);
    S.pagos[q.ref]={id:q.ref,prestamoId:q.pid,clienteId:p.clienteId,fecha:q.fecha,monto:q.monto,capital:a.capital,mora:a.mora,condonado:a.condonado,aplic:a.aplic,nota:q.nota,
      creado:q.creado,creadoPor:ME.id,pendiente:true,errorSync:q.error||'',concepto:desp.cancelacion<=0.004?'CANCELACION DE CREDITO':clasificarPago(Object.assign({},p,{cuotas:cuotasAntesCola}),q.monto,q.fecha,q.cond,CONFIG.toleranciaPago).concepto,saldoAnterior:antes.cancelacion,nuevoSaldo:desp.cancelacion,
      datosRecibo:Object.assign({},antes,{cobrador:ME.name||ME.id,cuotasAplicadas:a.aplic.map(x=>x.n),moraPerdonada:a.condonado,cuotasPendientes:a.cuotas.filter(c=>r2(c.total-c.pagado)>0.004).length,nCuotas:p.nCuotas,modalidad:p.modalidad})};
  });
}
function guardarCobroSinRed(pid,monto,fecha,cond,nota){
  const ref='OFF-'+(ME.id||'u').slice(0,6).toUpperCase()+'-'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
  const cola=leerCola();cola.push({ref,pid,monto,fecha,cond,nota,creado:new Date().toISOString(),usuario:ME.id});guardarCola(cola);
  aplicarColaLocal();render(true);pintarBarraRed();
  toast('Sin conexión: cobro guardado en el dispositivo');modalRecibo(ref,false);
}
async function sincronizarCola(manual){
  if(SINCRONIZANDO)return;const cola=leerCola().filter(q=>q.usuario===ME.id);if(!cola.length){if(manual)toast('No hay cobros pendientes');return}
  SINCRONIZANDO=true;pintarBarraRed();let ok=[],ultimo=null;
  for(const q of cola){
    try{const r=await apiRaw('registrarPago',[q.pid,q.monto,q.fecha,q.cond,q.nota?q.nota+' · cobrado sin conexión':'Cobrado sin conexión',q.ref]);
      ultimo=r;ok.push(r.recibo);guardarCola(leerCola().filter(x=>x.ref!==q.ref));SIN_RED=false}
    catch(e){if(esErrorRed(e)){SIN_RED=true;break}
      if(e&&e.sinSesion)break;
      const c=leerCola();const it=c.find(x=>x.ref===q.ref);if(it){it.error=e.message;guardarCola(c)}}
  }
  SINCRONIZANDO=false;
  if(ultimo){aplicarEstado(ultimo);guardarCache(ultimo)}else aplicarColaLocal();
  render();pintarBarraRed();
  if(ok.length)toast(`${ok.length===1?'Se sincronizó 1 cobro':'Se sincronizaron '+ok.length+' cobros'} · recibo${ok.length>1?'s':''} ${ok.join(', ')}`);
  else if(manual&&SIN_RED)toast('Todavía no hay conexión');
}
function descartarCobroSinRed(ref){
  if(!confirm('¿Descartar este cobro pendiente? Si el cliente pagó, deberás registrarlo de nuevo.'))return;
  guardarCola(leerCola().filter(x=>x.ref!==ref));delete S.pagos[ref];
  llamar('inicio',[],'Cobro pendiente descartado',{force:true}).then(r=>{if(!r){const ca=leerCache();if(ca&&ca.r)aplicarEstado(ca.r,true);render(true)}pintarBarraRed()});
}
function pintarBarraRed(){
  let b=$('#barraRed');if(!b){b=document.createElement('div');b.id='barraRed';document.body.appendChild(b)}
  const cola=leerCola().filter(q=>q.usuario===ME.id),err=cola.filter(q=>q.error);
  if(mode!=='gas'||(!SIN_RED&&!cola.length)){b.hidden=true;return}
  b.hidden=false;b.className='barra-red'+(err.length?' err':SIN_RED?' off':'');
  b.innerHTML=`<span>${SIN_RED?'<b>Sin conexión.</b> ':''}${cola.length?`${cola.length} ${cola.length===1?'cobro pendiente':'cobros pendientes'} de enviar${err.length?` · ${err.length} con problema`:''}.`:'Puedes seguir registrando cobros: se enviarán al volver la señal.'}${SIN_RED&&ESTADO_CACHE_TS?` Datos del ${fHoraCorta(ESTADO_CACHE_TS)}.`:''}</span>
  ${cola.length?`<button class="btn sm" data-sync ${SINCRONIZANDO?'disabled':''}>${SINCRONIZANDO?'Enviando…':'Sincronizar'}</button><a class="btn sm" href="#/pendientes">Ver</a>`:''}`;
}

    const pagos=Object.values(S.pagos).filter(x=>x.prestamoId===p.id&&!x.anulado).sort((a,b)=>(b.fecha+b.creado).localeCompare(a.fecha+a.creado));

  }).filter(Boolean).sort((a,b)=>b.dias-a.dias||b.exigible-a.exigible);

function filtrarCasos(cs){

    .filter(x=>!GF.soloFiador||x.g?.fiador?.nombres).filter(x=>!GF.soloPromesas||x.promVencida)
    .filter(x=>!q||[nombre(x.c),x.c?.cedula,x.c?.telefono,nomPersona(x.g?.fiador),x.g?.fiador?.cedula].join(' ').toLowerCase().includes(q));
}

/* ============ avisos: a quién le toca actuar en una solicitud ============ */
// Se calculan con el estado de cada solicitud: quien debe autorizar recibe el aviso al enviarse la verificación,
// y quien creó o verificó la solicitud recibe el aviso cuando se aprueba, autoriza, devuelve, deniega o desembolsa.
function avisosParaMi(){
  if(!ME.id)return [];const yo=ME.id,out=[],hace=d=>Math.abs(diffDays(hoyS(),String(d||'').slice(0,10)||hoyS()));
  solVista().forEach(x=>{
    const v=x.verificacion||{},mia=x.creadoPor===yo||v.enviadoPor===yo||x.gestor===yo,num='N° '+x.numero+' · '+nombreSol(x);
    if(x.estado==='POR_AUTORIZAR'&&puedeAutorizar()&&(v.enviadoPor!==yo||ME.esPropietario))
      out.push({k:'aut:'+x.id+':'+(v.verificadoEl||''),tono:'late',t:'Desembolso por autorizar',d:num+(v.enviadoPor?' · enviada por '+nomU(v.enviadoPor):''),href:`#/solicitud/${x.id}/4`,cuando:v.verificadoEl||x.actualizado});
    if(!mia)return;
    if(x.estado==='AUTORIZADA')out.push({k:'ok:'+x.id+':'+(v.autorizadoEl||''),tono:'ok',t:'Desembolso autorizado: puedes desembolsar',d:num+(v.gerente?' · visto bueno de '+v.gerente:'')+(v.obsVistoBueno?' · '+v.obsVistoBueno:''),href:`#/solicitud/${x.id}/4`,cuando:v.autorizadoEl||x.actualizado});
    if(x.estado==='APROBADA'&&v.devolucion)out.push({k:'dev:'+x.id+':'+v.devolucion.fecha,tono:'due',t:'Verificación devuelta para corregir',d:num+' · '+v.devolucion.motivo,href:`#/solicitud/${x.id}/4`,cuando:v.devolucion.fecha});
    else if(x.estado==='APROBADA'&&x.aprobadoEl&&hace(x.aprobadoEl)<=7&&x.creadoPor===yo&&x.aprobadoPor!==yo)out.push({k:'apr:'+x.id+':'+x.aprobadoEl,tono:'info',t:'Solicitud aprobada: registra las garantías',d:num,href:`#/solicitud/${x.id}/3`,cuando:x.aprobadoEl});

/* ---- represtamos ---- */
function desgloseCli(p,fecha){
  let cuotaDia=0,atrasado=0,mora=0,saldo=0,dias=0;
  p.cuotas.forEach(c=>{const e=estCuota(p,c,fecha);saldo+=e.saldo;mora+=e.moraPend;if(e.estado==='pagada')return;
    if(c.fecha===fecha)cuotaDia+=e.saldo;else if(c.fecha<fecha){atrasado+=e.saldo;dias=Math.max(dias,diffDays(fecha,c.fecha))}});
  return {cuotaDia:r2(cuotaDia),atrasado:r2(atrasado),diasMora:dias,mora:r2(mora),cancelacion:r2(saldo+mora)};
}
function activosCliente(cid,fecha){return Object.values(S.prestamos).filter(p=>p.clienteId===cid).map(p=>({p,deuda:desgloseCli(p,fecha||hoyS())})).filter(x=>x.deuda.cancelacion>0.004)}
function tieneActivo(cid){return activosCliente(cid).length>0}
function elegibleCli(p,fecha){
  const minPct=Number(CONFIG.represtamoMinPct||0),maxAt=Number(CONFIG.represtamoMaxAtraso||0);
  const pagadas=p.cuotas.filter(c=>r2(c.total-c.pagado)<=0.004).length,pct=p.cuotas.length?Math.floor(pagadas/p.cuotas.length*100):0;
  const dias=desgloseCli(p,fecha).diasMora;
  if(pct<minPct)return {ok:false,pagadas,pct,dias,motivo:`ha pagado ${pagadas} de ${p.cuotas.length} cuotas (${pct}%) y se requiere al menos ${minPct}%.`};
  if(dias>maxAt)return {ok:false,pagadas,pct,dias,motivo:`tiene ${dias} días de atraso y se permiten como máximo ${maxAt}.`};
  return {ok:true,pagadas,pct,dias};
}
// Evalúa qué operación corresponde al cliente elegido en el formulario
function evaluarOperacion(){
  const d=draft;if(!d||!d.clienteId)return {tipo:'NUEVO',puede:true};
  const act=activosCliente(d.clienteId,d.fecha);
  if(!act.length){d.tipoOperacion='NUEVO';return {tipo:'NUEVO',puede:true}}
  d.tipoOperacion='REPRESTAMO';
  const ev=act.map(x=>({...x,e:elegibleCli(x.p,d.fecha)}));

  else if('printsol' in d){const sol=S.solicitudes[SOLID];if(sol)imprimirDoc(docSolicitud(sol),'imprimirSolicitud','Solicitud N° '+sol.numero)}
  else if(d.delsol){if(confirm('¿Eliminar esta solicitud? No se puede deshacer.'))llamar('eliminarSolicitud',[d.delsol],'Solicitud eliminada',{force:true}).then(r=>{if(r){SOLD=null;location.hash='#/solicitudes'}})}
  else if(d.aprobsol){const a=APD;if(!confirm(`¿Aprobar ${fmt(a.monto)} a ${a.meses} meses, ${a.nCuotas} cuotas ${MOD[a.frecuencia]?.label.toLowerCase()}?`))return;llamar('aprobarSolicitud',[d.aprobsol,{...a}],'Solicitud aprobada',{force:true}).then(r=>{if(r){APD=null;render(true)}})}
  else if(d.reabrir){if(confirm('¿Reabrir la solicitud? Se quitará la aprobación actual.'))llamar('reabrirSolicitud',[d.reabrir],'Solicitud reabierta',{force:true}).then(r=>{if(r){APD=null;SOLD=null;render(true)}})}
  else if(d.printplan){const sol=S.solicitudes[d.printplan];if(sol)imprimirDoc(docPlan(planDeSolicitud(sol)),'imprimirPlan','Solicitud N° '+sol.numero)}
  else if(d.printplanp){const p=S.prestamos[d.printplanp];if(p)imprimirDoc(docPlan(planDePrestamo(p)),'imprimirPlan','Préstamo '+p.id)}
  else if('addgar' in d){GARD.items.push({});render(true)}
  else if(d.savegar){const g={declaracion:GARD.declaracion,items:GARD.items};llamar('guardarGarantias',[d.savegar,g],null,{force:true}).then(r=>{if(r){GARD=null;render(true);toast(r.faltantes.length?'Garantías guardadas, pero incompletas':'Garantías completas y guardadas')}})}
  else if(d.printgar){const sol=S.solicitudes[d.printgar];if(sol)imprimirDoc(docGarantias(sol),'imprimirGarantias','Solicitud N° '+sol.numero)}
  else if(d.vchk){VFD.checks=VFD.checks||{};VFD.checks[d.vchk]=Object.assign({},VFD.checks[d.vchk],{v:d.v});$$(`[data-vchk="${d.vchk}"]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===d.v));actualizarVerif()}
  else if(d.vrefc!==undefined){VFD.refCalif=VFD.refCalif||['','',''];VFD.refCalif[d.vrefc]=d.v;$$(`[data-vrefc="${d.vrefc}"]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===d.v));actualizarVerif()}
  else if(d.vsel){VFD[d.vsel]=d.v;$$(`[data-vsel="${d.vsel}"]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===d.v));actualizarVerif()}
  else if(d.enviaraut){if(!confirm('¿Enviar la hoja de verificación a autorización? Ya no podrás modificarla, salvo que el autorizador la devuelva.'))return;
    llamar('enviarAutorizacion',[d.enviaraut,VFD,!!VFD.condonar],'Enviada a autorización',{force:true}).then(r=>{if(r){try{localStorage.removeItem(claveVF(d.enviaraut))}catch(e){}VFD=null;render(true)}})}
  else if(d.autorizar){const sol=S.solicitudes[d.autorizar];if(!confirm(`¿Autorizar el desembolso de ${fmt(sol.aprobacion.monto)} a ${nombreSol(sol)}?`))return;
    llamar('autorizarDesembolso',[d.autorizar,$('#vbObs')?.value||''],'Desembolso autorizado',{force:true}).then(r=>{if(r){VFD=null;render(true)}})}
  else if(d.devolver){const m=($('#vbObs')?.value||'').trim()||prompt('¿Qué se debe corregir en la verificación?')||'';if(!m.trim()){toast('Explica qué se debe corregir');return}
    llamar('devolverVerificacion',[d.devolver,m.trim()],'Verificación devuelta',{force:true}).then(r=>{if(r){VFD=null;render(true)}})}
  else if(d.desembolsar){const sol=S.solicitudes[d.desembolsar];const ap=sol.aprobacion;const act=activosCliente(sol.clienteId,ap.fechaDesembolso);
    if(!confirm(`¿Desembolsar ${fmt(ap.monto)} a ${nombreSol(sol)}?\n\nEl plan de pagos se calculará desde hoy, ${fF(hoyS())}.${act.length?' Es un represtamo: se liquidará la deuda del préstamo activo.':''}`))return;
    llamar('desembolsarSolicitud',[d.desembolsar],'Crédito desembolsado',{force:true}).then(r=>{if(r){try{localStorage.removeItem(claveVF(d.desembolsar))}catch(e){}VFD=null;location.hash='#/prestamo/'+r.nuevoId;if(r.liquidaciones?.length)setTimeout(()=>modalRepresstamoHecho(r),150)}})}
  else if(d.denegar){const rz=$('#vraz');if(rz)VFD.razones=rz.value;if(!String(VFD.razones||'').trim()){toast('Explica las razones de la denegación');$('#vraz')?.focus();return}if(!confirm('¿Denegar esta solicitud?'))return;
    llamar('denegarSolicitud',[d.denegar,VFD],'Solicitud denegada',{force:true}).then(r=>{if(r){try{localStorage.removeItem(claveVF(d.denegar))}catch(e){}VFD=null;render(true)}})}
  else if(d.printdes){const sol=S.solicitudes[d.printdes];if(sol)imprimirDoc(docDesembolso(sol),'imprimirDesembolso','Solicitud N° '+sol.numero)}
  else if(d.verrc)modalRecibo(d.verrc,true);
  else if(d.printrc)imprimirRecibo(d.printrc,!!d.re);
  else if(d.sharerc)compartirRecibo(d.sharerc);
  else if('savecfg' in d){guardarAjustes();return}
  else if('audbuscar' in d){$$('[data-af]').forEach(i=>AUDV.f[i.dataset.af]=i.value.trim());AUDV.integridad=null;cargarAuditoria()}
  else if('audlimpiar' in d){AUDV.f={desde:'',hasta:'',usuario:'',modulo:'',resultado:'',texto:''};AUDV.integridad=null;cargarAuditoria()}
  else if('audverif' in d){t.disabled=true;t.textContent='Verificando…';api('verificarAuditoria').then(r=>{AUDV.integridad=r;render(true)}).catch(e=>{toast(e.message);render(true)})}
  else if(d.audver!==undefined)modalAuditoria(Number(d.audver));
  else if('audcsv' in d)exportarAuditoriaCSV();
  else if('cambiarclave' in d){closeModal();openModal(vistaCambioClave(false).replace('class="login"','class="login" style="min-height:0"'))}
  else if(d.toggleuser){const m=USERS.miembros[d.toggleuser];const act=m.activo===false;llamar('guardarUsuario',[d.toggleuser,m.nombre,m.rol,act],act?'Usuario activado':'Usuario desactivado',{force:true})}
  else if(d.deluser){if(confirm('¿Quitar el acceso de este usuario? Sus préstamos asignados quedan sin cobrador.'))llamar('quitarUsuario',[d.deluser],'Acceso quitado',{force:true})}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.af){AUDV.f[t.dataset.af]=t.value;return}
  if(t.hasAttribute('data-gq')){GF.q=t.value;const pos=t.selectionStart;render(true);const n=$('#gf-q');if(n){n.focus();n.setSelectionRange(pos,pos)}return}
  if(t.dataset.rt&&RUTAD){RUTAD.f[t.dataset.rt]=t.value;return}
  if(t.id==='rtBuscar'){pintarListaRuta();return}
  if(t.hasAttribute('data-simcuotas')){SIM.nCuotas=t.value;SIM.manual=true;const c=cuotasDe(SIM.meses,SIM.modalidad),nt=$('#sim-nCuotasNota');if(nt)nt.innerHTML=Number(t.value)!==c?`Diferenciadas · según el plazo serían ${c}. <a href="javascript:void 0" data-simauto>Usar ${c}</a>`:'Calculadas según el plazo; puedes cambiarlas.';pintarSimulacion();return}
  if(t.hasAttribute('data-apcuotas')&&APD){APD.nCuotas=t.value;APD.manual=true;return}
  if(t.dataset.sim){const k=t.dataset.sim;SIM[k]=t.value;
    if(k==='meses'&&!SIM.manual){SIM.nCuotas=cuotasDe(SIM.meses,SIM.modalidad);const nc=$('#sim-nCuotas');if(nc)nc.textContent=SIM.nCuotas+' cuotas';const ni=$('#sim-nCuotasIn');if(ni)ni.value=SIM.nCuotas}
    pintarSimulacion();return}
  if(t.hasAttribute('data-clibuscar')){buscarClientesSol(t.value);return}
  if(t.dataset.sf&&SOLD){setP(SOLD,t.dataset.sf,t.value);SOLDIRTY=true;actualizarProgreso();return}
  if(t.dataset.gar&&GARD){const [i,k]=t.dataset.gar.split('.');GARD.items[i][k]=k==='valor'?t.value:t.value;actualizarGarantias();return}
  if(t.dataset.vobs&&VFD){VFD.checks=VFD.checks||{};VFD.checks[t.dataset.vobs]=Object.assign({},VFD.checks[t.dataset.vobs],{obs:t.value});actualizarVerif();return}
  if(t.dataset.vref!==undefined&&VFD){VFD.referenciasVecinales=VFD.referenciasVecinales||['','',''];VFD.referenciasVecinales[t.dataset.vref]=t.value;actualizarVerif();return}
  if(t.dataset.vtxt&&VFD){VFD[t.dataset.vtxt]=t.value;actualizarVerif();return}
  if(t.dataset.cf){setTimeout(marcarAjustes,0);const tmp={...CONFIG};$$('[data-cf]').forEach(i=>tmp[i.dataset.cf]=i.dataset.cf==='feriados'?i.value:i.value.trim());const pf=$('#cfProxFer');if(pf)pf.innerHTML=proximosFeriados(tmp);const fb=$('#cfFeriados');if(fb)fb.hidden=tmp.excluirFeriados==='no';const prev=$('#cfPrev');if(prev)prev.innerHTML=previewAjustes(tmp);return}
  if(t.dataset.search){ui[t.dataset.search]=t.value;const pos=t.selectionStart;render(true);const n=$(`[data-search="${t.dataset.search}"]`);n.focus();n.setSelectionRange(pos,pos);return}
  if(t.dataset.d&&draft){const k=t.dataset.d;draft[k]=['monto','meses','nCuotas','interes','tasaMora'].includes(k)?num(t.value):t.value;
    if(k==='nCuotas')draft.cuotasManual=true;
    if(k==='meses'&&!draft.cuotasManual){draft.nCuotas=Math.max(1,Math.round(draft.meses*MOD[draft.modalidad].porMes));$('#f-cuotas').value=draft.nCuotas}
    pintarPreview();return}
  if(t.id==='pg-monto'){PGSEL='manual';$$('[data-quick]').forEach(b=>b.setAttribute('aria-pressed','false'))}
  if(t.closest('#modal')&&$('[data-confirmpay]'))previewPago($('[data-confirmpay]').dataset.confirmpay);
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.gf){GF[t.dataset.gf]=t.value;render(true);return}
  if(t.dataset.gchk){GF[t.dataset.gchk]=t.checked;render(true);return}
  if(t.hasAttribute('data-rtact')&&RUTAD){RUTAD.f.activa=t.checked;return}
  if(t.id==='rt-c'&&RUTAD){RUTAD.f.cobradorId=t.value;render(true);return}
  if(t.hasAttribute('data-apcuotas')&&APD){APD.nCuotas=t.value;APD.manual=true;render(true);return}
  if(t.dataset.rfecha){RPT[t.dataset.rfecha]=t.value;render(true);return}
  if(t.dataset.logofile&&t.files&&t.files[0]){subirLogo(t.dataset.logofile,t.files[0]);t.value='';return}
  if(t.dataset.prol&&PRD){const [k,r]=t.dataset.prol.split('|');PRD[k]=t.checked?[...new Set([...PRD[k],r])]:PRD[k].filter(x=>x!==r);const sc=$('#main');const y=window.scrollY;render(true);window.scrollTo(0,y);return}
  if(t.id==='c-estadoCivil'){const b=$('#cyBox');if(b)b.hidden=!esCasado(t.value)}
  if(t.id==='c-departamento'){const sel=$('#c-municipio');if(sel)sel.innerHTML='<option value="">Elige…</option>'+(NIC_DEPTOS[t.value]||[]).map(m=>`<option>${esc(m)}</option>`).join('')}
  if(t.dataset.sfchk&&SOLD){SOLD[t.dataset.sfchk]=t.checked;SOLDIRTY=true;if(t.dataset.sfchk==='sinFiador'){const b=$('#fiadorBox');if(b)b.hidden=t.checked}actualizarProgreso();return}
  if(t.dataset.sf&&SOLD){setP(SOLD,t.dataset.sf,t.value);SOLDIRTY=true;
    if(/^referencias\.[01]\.parentesco$/.test(t.dataset.sf))sincronizarParentesco(Number(t.dataset.sf.split('.')[1]));
    if(t.dataset.sf.endsWith('.departamento')){const pref=t.dataset.sf.split('.')[0];const sel=$('#sf-'+pref+'-municipio');const lista=NIC_DEPTOS[t.value]||[];
      if(!lista.includes(getP(SOLD,pref+'.municipio')))setP(SOLD,pref+'.municipio','');
      if(sel)sel.innerHTML='<option value="">Elige…</option>'+lista.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}
    actualizarProgreso();return}
  if(t.dataset.ap&&APD){APD[t.dataset.ap]=t.value;if((t.dataset.ap==='frecuencia'||t.dataset.ap==='meses')&&!APD.manual){APD.nCuotas=cuotasDe(APD.meses,APD.frecuencia)}render(true);return}
  if(t.dataset.gar&&GARD){const [i,k]=t.dataset.gar.split('.');GARD.items[i][k]=t.value;actualizarGarantias();return}
  if(t.hasAttribute&&t.hasAttribute('data-garchk')&&GARD){GARD.declaracion=t.checked;actualizarGarantias();return}
  if(t.hasAttribute&&t.hasAttribute('data-vcond')&&VFD){VFD.condonar=t.checked;actualizarVerif();return}
  if(t.dataset.dchk&&draft){draft[t.dataset.dchk]=t.checked;pintarPreview();return}
  if(t.dataset.setrol){const id=t.dataset.setrol,m=USERS.miembros[id];llamar('guardarUsuario',[id,m.nombre,t.value,m.activo!==false],'Rol actualizado',{force:true});return}
  if(t.dataset.asignar){llamar('asignarCobrador',[t.dataset.asignar,t.value],'Cobrador asignado',{force:true});return}
  if(t.dataset.solrol)return;if(t.dataset.d&&draft){draft[t.dataset.d]=t.value;pintarPreview()}else if(t.closest('#modal')&&$('[data-confirmpay]')){if(t.id==='pg-cond'||t.id==='pg-fecha')actualizarMontosPago($('[data-confirmpay]').dataset.confirmpay);else previewPago($('[data-confirmpay]').dataset.confirmpay)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeModal();if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.af!==undefined){$('[data-audbuscar]')?.click()}});

$('#sideLogo').src=LOGO_FULL;route=parse();mode='cargando';render(true);initStore();

</script>
</body>
</html>
